site_name: oci2bin
site_description: Convert OCI and Docker images into mostly self-contained Linux executables.
site_url: https://latedeployment.github.io/oci2bin/
repo_url: https://github.com/latedeployment/oci2bin
repo_name: latedeployment/oci2bin

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  # Geist is self-hosted from docs/assets/fonts (see stylesheets/extra.css),
  # so readers' browsers make no requests to Google Fonts.
  font: false
  palette:
    # The first entry is the default: dark, like the shared site design.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Use Cases: use-cases.md
  - Concepts: concepts.md
  - Build Binaries: build.md
  - Run Binaries: runtime.md
  - Security: security.md
  - Operations: operations.md
  - Benchmarks: benchmarks.md
  - Feature Inventory: reference/features.md
  - Command Reference: reference/commands.md
  - Dependencies: reference/dependencies.md
  - Environment Variables: reference/environment.md
  - How It Works: internals/how-it-works.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
