[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# oci2bin is Linux-only; skip any platform-specific resolution elsewhere.
environments = ["sys_platform == 'linux'"]

[project]
name = "oci2bin"
version = "0.18.0"
description = "Convert OCI/Docker images into mostly self-contained Linux executables"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["docker", "oci", "container", "linux", "rootless"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
# No Python package dependencies: the builder uses only the standard library.
# Compilers, image pull backends, and target helpers are feature-dependent
# system requirements documented in the dependency reference.
dependencies = []

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
]
# Pinned so `make lint-semgrep` is reproducible. A bare `semgrep` on PATH is
# easy to end up with in a half-installed state (a system install missing its
# `attrs` dependency fails with ModuleNotFoundError, not a lint error), so the
# Makefile prefers `uv run --group lint`.
# The marker matters: the project supports Python >= 3.9 but semgrep requires
# >= 3.10, and uv resolves dependency groups against the project's whole
# requires-python range, so an unmarked pin makes resolution unsatisfiable.
lint = [
    "semgrep>=1.155,<2; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/latedeployment/oci2bin"
Changelog = "https://github.com/latedeployment/oci2bin/blob/main/CHANGELOG.md"

[project.scripts]
oci2bin = "oci2bin_pkg._entry:main"
oci2vm  = "oci2bin_pkg._entry:main"

[tool.setuptools.packages.find]
include = ["oci2bin_pkg*"]

[tool.setuptools.package-data]
"oci2bin_pkg" = [
    "oci2bin.bash",
    "scripts/*.py",
    "src/loader.c",
]
